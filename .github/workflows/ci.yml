name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Chatbot eval gate (precision)
        # The chatbot precision gate: intent accuracy >= 95%, grounding 100%,
        # correct-refusal 100%, hallucination 0. Fails the build on any
        # grounding, hallucination, or tenant-isolation regression.
        run: npm run test:chatbot

      - name: Build
        run: npm run build
